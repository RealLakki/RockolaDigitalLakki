<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFA0C4"/>
      <stop offset="100%" stop-color="#FF6AAA"/>
    </linearGradient>
  </defs>

  <!-- Disco redondo (vinilo) -->
  <circle cx="32" cy="32" r="29" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.55"/>

  <!-- Centro teal -->
  <circle cx="32" cy="32" r="6" fill="#17A1B9"/>
  <circle cx="32" cy="32" r="2" fill="#FFFADC"/>

  <!-- Nota musical encima del disco -->
  <g transform="translate(36 16)" fill="#FFFADC">
    <rect x="0" y="0" width="2.5" height="16" rx="1"/>
    <ellipse cx="-2" cy="16" rx="4.5" ry="3.5"/>
  </g>
</svg>
