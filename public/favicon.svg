<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#5BE2FF"/>
      <stop offset="100%" stop-color="#00D4FF"/>
    </linearGradient>
  </defs>

  <!-- Disco redondo (vinilo) -->
  <circle cx="32" cy="32" r="29" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="22" fill="none" stroke="#0A0A0F" stroke-width="1.5" opacity="0.45"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="#0A0A0F" stroke-width="1.5" opacity="0.45"/>

  <!-- Centro negro con punto cian -->
  <circle cx="32" cy="32" r="6" fill="#0A0A0F"/>
  <circle cx="32" cy="32" r="2" fill="#5BE2FF"/>

  <!-- Nota musical encima del disco -->
  <g transform="translate(36 16)" fill="#0A0A0F">
    <rect x="0" y="0" width="2.5" height="16" rx="1"/>
    <ellipse cx="-2" cy="16" rx="4.5" ry="3.5"/>
  </g>
</svg>
