<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="cone" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFD633"/>
      <stop offset="42%" stop-color="#E8B800"/>
      <stop offset="100%" stop-color="#2A1E06"/>
    </radialGradient>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#281A0A"/>
      <stop offset="100%" stop-color="#1C1209"/>
    </linearGradient>
  </defs>

  <!-- Cuerpo del bafle -->
  <circle cx="32" cy="32" r="30" fill="url(#body)"/>
  <!-- Borde ambar exterior -->
  <circle cx="32" cy="32" r="30" fill="none" stroke="#E8B800" stroke-width="1.5"/>
  <!-- Anillo de surround -->
  <circle cx="32" cy="32" r="25" fill="none" stroke="#E8B800" stroke-width="1" opacity="0.45"/>
  <!-- Cono del parlante -->
  <circle cx="32" cy="32" r="20" fill="url(#cone)"/>
  <!-- Voice coil ring -->
  <circle cx="32" cy="32" r="13" fill="none" stroke="#E8B800" stroke-width="1.2" opacity="0.50"/>
  <!-- Dust cap oscuro -->
  <circle cx="32" cy="32" r="7.5" fill="#1C1209"/>
  <!-- Centro ambar -->
  <circle cx="32" cy="32" r="4.5" fill="#E8B800"/>
  <!-- Agujero central -->
  <circle cx="32" cy="32" r="2" fill="#1C1209"/>
</svg>
